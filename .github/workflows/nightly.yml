# Nightly build workflow.
#
# Fires when the CI workflow finishes on main; the `if:` guard on the prepare
# job skips everything unless CI concluded with 'success' AND the run originated
# from this repository (not a fork). Only publishes if CI passed — so the nightly
# release always contains a tested, lint-clean build.
# Deletes and recreates a fixed "nightly" pre-release so there is always one download
# link per platform pointing at the latest main build.
# The release is marked as pre-release so it does not appear as the latest stable release.
#
# Job topology: prepare → build → checksums; cleanup-on-failure depends on all three.
#
#   prepare            — recreates the nightly GitHub release (deletes the old one first).
#   build              — compiles the release demo on each platform in parallel, uploads archives.
#   checksums          — runs after all build matrix legs succeed; downloads archives, generates and uploads SHA256 sums.
#   cleanup-on-failure — needs: [prepare, build, checksums]; deletes the release if build or
#                        checksums failed, was cancelled, or was skipped.

name: Nightly

# ── Trigger ───────────────────────────────────────────────────────────────────
# workflow_run fires after another workflow finishes. We listen for the "CI"
# workflow (ci.yml) to complete on the main branch.
#
# The `if:` guard on the prepare job below makes sure we only proceed when that
# run actually succeeded — a failed CI run does not produce a new nightly build.
on:
  workflow_run:
    workflows: ["CI"] # must match the `name:` field in ci.yml exactly.
    types: [completed]  # fire on any conclusion (success, failure, cancelled, etc.); the guard filters out non-success.
    branches: ["main"]  # only care about runs on the main branch.

# ── Concurrency ───────────────────────────────────────────────────────────────
# Only one nightly run may be active at a time. If two pushes land in quick
# succession and both pass CI, the second run waits for the first to finish.
# Without this, prepare-B would delete and recreate the release while build-A
# is still uploading, mixing artifacts from two different commits.
#
# cancel-in-progress must stay FALSE. Cancelling a run mid-flight still executes
# its `always()` cleanup-on-failure job (that is what always() means), which
# would then race with the next run's prepare job and can delete the release
# that run just created — leaving no nightly at all. Queueing avoids the overlap
# entirely; GitHub keeps only the newest pending run in the queue, so we still
# converge on the latest commit.
concurrency:
  group: nightly
  cancel-in-progress: false

# ── Global environment ────────────────────────────────────────────────────────
# CARGO_TERM_COLOR forces colored Cargo output in CI logs (stdout is not a TTY
# in GitHub Actions, so color is off by default).
env:
  CARGO_TERM_COLOR: always

# ── Permissions ───────────────────────────────────────────────────────────────
# Default to no permissions. Each job that needs to write to releases declares
# `permissions: contents: write` explicitly, so the blast radius of a
# compromised step is limited to what that specific job actually requires.
permissions: {}

jobs:

  # ── prepare ──────────────────────────────────────────────────────────────────
  # Recreate the nightly GitHub release so it always points at the current commit.
  #
  # Why delete and recreate instead of just updating?
  # GitHub releases store assets as a flat list. Updating a release does not remove
  # old assets, so a fresh delete+create is the simplest way to guarantee a clean slate.
  prepare:
    # Only run when:
    #   1. The upstream CI run concluded with 'success' (not failure/cancelled/etc.).
    #   2. The triggering run originated from THIS repository, not a fork.
    #      Without the head_repository check, a fork contributor who names their
    #      branch 'main' satisfies the branches: filter and the build job would
    #      check out the fork's code (potentially a malicious build.rs) while
    #      holding a contents:write token.
    # Note: `if:` fields are evaluated as expressions by GitHub Actions — the
    # ${{ }} wrapper is not needed and is omitted here for clarity.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    # Explicit grant: this job needs to write to repository contents (releases are
    # stored there). The workflow-level `permissions: {}` grants nothing by default,
    # so every job that needs access must declare it explicitly.
    permissions:
      contents: write

    runs-on: ubuntu-latest
    steps:
      # No checkout step: this job never touches the source tree. Every gh CLI
      # call targets the repository explicitly via the GH_REPO env var, so no
      # git context is needed.
      - name: Recreate nightly release
        run: |
          # Delete the previous nightly release if it exists.
          # --cleanup-tag also deletes the `nightly` git tag — without it the tag stays
          # pointing at the old commit and `gh release create nightly` fails on the next
          # run because the tag already exists.
          # stderr is NOT suppressed here: real errors (bad token, rate-limit, network)
          # should be visible in the log. `|| true` only suppresses the non-zero exit
          # code that gh returns when the release does not exist yet (first run).
          gh release delete nightly --yes --cleanup-tag || true

          # Take the first 8 characters of the commit SHA for a short human-readable link.
          SHORT_SHA=$(echo "$HEAD_SHA" | cut -c1-8)

          # Create a new pre-release tagged "nightly".
          # --target pins the git tag to HEAD_SHA — the exact commit CI tested. Without
          # this flag gh tags the current HEAD of the default branch, which may be a
          # different, untested commit if another push landed while this workflow ran.
          # --prerelease means GitHub will not show this as the "Latest" release on the
          # repo's main page — it stays clearly labelled as a development build.
          gh release create nightly \
            --prerelease \
            --target "$HEAD_SHA" \
            --title "Nightly ($(date -u '+%Y-%m-%d'))" \
            --notes "Built from [\`$SHORT_SHA\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$HEAD_SHA) on \`main\`."
        env:
          # GITHUB_TOKEN is an automatically generated short-lived token that GitHub
          # injects into every workflow run. No manual secret setup required.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Use the SHA from the upstream CI run, not GITHUB_SHA. With workflow_run,
          # GITHUB_SHA is the HEAD of main when this workflow fires — which can differ
          # if two commits land in quick succession. head_sha is the exact commit that
          # CI tested and approved.
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

  # ── build ─────────────────────────────────────────────────────────────────────
  # Compile the demo (the `ferrets-demo` package's `demo` binary) on each platform, pack it
  # into an archive (.tar.gz on Linux/macOS, .zip on Windows), and upload the
  # archive to the nightly release.
  build:
    # Wait for the release to exist before trying to upload to it.
    needs: prepare

    permissions:
      contents: write

    # Matrix strategy: each entry in `include` becomes an independent parallel job.
    # fail-fast: false means a failure on one platform does not cancel the others.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest   # GitHub-hosted x86_64 Linux runner
            suffix: linux-x86_64
          - os: macos-latest    # GitHub-hosted ARM64 macOS runner (Apple Silicon)
            suffix: macos-arm64
          - os: windows-latest  # GitHub-hosted x86_64 Windows runner
            suffix: windows-x86_64

    # ${{ matrix.os }} expands to the value from whichever matrix row this job is.
    runs-on: ${{ matrix.os }}

    # Use bash for every run step on every platform. Windows runners default to
    # PowerShell, where `"$ARCHIVE"`-style environment variable references would
    # silently expand to an empty string instead of the archive name.
    defaults:
      run:
        shell: bash

    steps:
      # Check out the exact commit that CI tested, not just the current HEAD of main.
      # This keeps the build and the test run in sync even when commits land quickly.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # System libraries + Cargo cache; see .github/actions/setup. The
      # distinct prefix keeps this release-profile cache namespace apart from
      # the CI debug caches structurally, without relying on job ids staying
      # unique across workflows.
      - uses: ./.github/actions/setup
        with:
          prefix-key: v0-rust-nightly

      # --release    optimize for speed (opt-level 3, no debug info).
      # --locked     fail if Cargo.lock is out of sync with Cargo.toml (reproducible builds).
      # --bin <name> build only the named binary, not the entire workspace.
      - name: Build
        run: cargo build --release --locked --bin demo

      - name: Package
        # SUFFIX is passed via env: so the matrix value is never interpolated directly
        # into the shell script body — safe even if the matrix were made dynamic.
        #
        # Windows gets a .zip (extractable from Explorer, no extra tools needed);
        # Linux and macOS get the conventional .tar.gz. Windows binaries carry an
        # .exe extension, hence the separate file lists.
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          if [[ "$SUFFIX" == windows-* ]]; then
            ARCHIVE="ferrets-${SUFFIX}.zip"
            # 7z stores paths as given, so cd into target/release first to get a
            # flat archive with the binary at the top level (mirrors tar's -C flag).
            (cd target/release && 7z a "../../$ARCHIVE" demo.exe)
          else
            ARCHIVE="ferrets-${SUFFIX}.tar.gz"
            # -C target/release changes into that directory before adding files,
            # so the archive contains `demo` at the top level (no path prefix).
            tar -czf "$ARCHIVE" -C target/release demo
          fi
          # Write the archive name to GITHUB_ENV so the next step can reference it
          # without repeating the matrix suffix expansion.
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      # --clobber replaces the asset if a previous partial run already uploaded it.
      - name: Upload to nightly release
        run: gh release upload nightly "$ARCHIVE" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # ── checksums ─────────────────────────────────────────────────────────────────
  # Generate a SHA256 digest for every archive and publish it as checksums.txt.
  # Users can verify their download has not been corrupted or tampered with by
  # running (--ignore-missing skips the platforms they did not download):
  #   sha256sum --ignore-missing -c checksums.txt
  checksums:
    # Wait for all build jobs to finish so every archive is already in the release.
    needs: build

    permissions:
      contents: write

    runs-on: ubuntu-latest
    steps:
      # Download all archive assets (.tar.gz for Linux/macOS, .zip for Windows)
      # from the nightly release into the `archives/` folder.
      # GH_REPO tells the gh CLI which repository to target — this job has no checkout
      # step so the gh CLI cannot infer the repo from the git remote.
      - name: Download release archives
        run: gh release download nightly --pattern "*.tar.gz" --pattern "*.zip" --dir archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Generate checksums
        run: |
          cd archives
          # sha256sum writes one line per file: "<hex-digest>  <filename>"
          # Printing to stdout as well makes the digest visible in the CI log.
          sha256sum *.tar.gz *.zip > ../checksums.txt
          cat ../checksums.txt

      - name: Upload checksums
        run: gh release upload nightly checksums.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # ── cleanup-on-failure ────────────────────────────────────────────────────────
  # Deletes the nightly release whenever build or checksums did not fully succeed
  # (failed, cancelled, or skipped), so users never see a partial or
  # checksum-less release.
  #
  # Why always() is required: without it GitHub Actions wraps the if: expression
  # with an implicit success() check. When build fails, success() is false and
  # the entire condition evaluates to false — the cleanup job is silently skipped,
  # which is exactly the opposite of what we want.
  #
  # Why needs.prepare.result == 'success' is required: if prepare was skipped
  # (because CI failed or the trigger came from a fork) no release was created,
  # so there is nothing to clean up. Without this guard the job would call
  # `gh release delete` on a release that does not exist.
  cleanup-on-failure:
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (needs.build.result != 'success' || needs.checksums.result != 'success')
    needs: [prepare, build, checksums]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Delete partial nightly release
        run: gh release delete nightly --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
