# Shared job setup: the Linux system libraries Bevy links against, plus the
# Cargo cache. Used by every job that compiles the workspace, so a new system
# dependency or a caching change is made in exactly one place.
name: Setup build environment
description: Install Linux build dependencies and restore the Cargo cache.

inputs:
  prefix-key:
    description: >-
      Cache key prefix. Jobs that must never share a cache namespace (e.g.
      release builds vs the CI debug jobs) pass a distinct prefix instead of
      relying on their job ids staying unique across workflows.
    required: false
    default: v0-rust

runs:
  using: composite
  steps:
    # Bevy links against system libraries on Linux (audio via ALSA, device
    # events via udev, windowing via X11/Wayland). GitHub's Ubuntu runners do
    # not ship the development headers, so compiling the workspace fails
    # without them. macOS and Windows runners need nothing extra.
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev

    # Rust-aware caching instead of a raw actions/cache over target/: a full
    # target directory for this workspace is far too large to archive (the
    # post-job save can take tens of minutes on Windows and exceeds GitHub's
    # 10 GB per-repository cache quota). rust-cache prunes the cache down to
    # dependency artifacts — workspace crates recompile in seconds once the
    # dependencies are warm — and its automatic key already includes the job
    # id, the OS and architecture, the toolchain, and the lockfile hash, so
    # every job on every platform gets its own cache with no hand-written
    # keys. It also disables incremental compilation, which only bloats CI
    # artifacts.
    #
    # Known trade-off: restore is strictly per-job (there is no cross-job
    # fallback), so a job whose own cache is missing — quota eviction, a new
    # job, a toolchain bump — starts cold instead of borrowing a sibling's
    # downloaded dependencies. That costs one registry download on a rare
    # event; the alternative (a shared key) would make concurrent jobs race
    # to save one immutable entry and permanently starve whichever loses.
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: ${{ inputs.prefix-key }}
        # Save the cache even when a later step fails, so a red run still
        # warms the dependency build for the fix-up run that follows it.
        cache-on-failure: true
